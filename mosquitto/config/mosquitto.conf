# Mosquitto im Container (eclipse-mosquitto).
# Ohne "listener" hört Mosquitto 2.x nur auf localhost im Container
# und wäre von außen (Pi, Backend-Container) nicht erreichbar.
listener 1883
# Wie bisher auf dem Laptop: ohne Anmeldung, nur im eigenen Netz verwenden.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

# Nach stdout, dann zeigt "docker compose logs mosquitto" alles an.
log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S
